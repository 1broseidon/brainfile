name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test core
        run: npm run test:ci -w core

      - name: Test cli
        run: npm test -w cli

      - name: Upload coverage
        uses: codecov/codecov-action@v5
        with:
          files: ./core/coverage/lcov.info
          flags: core
          fail_ci_if_error: false
