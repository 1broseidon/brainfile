name: Publish to npm

# Publishes @brainfile/core then brainfile when a GitHub Release is published.
# Auth: npm trusted publishing (OIDC) — no secrets needed once the trusted
# publisher is configured on npmjs.com for each package (repo: 1broseidon/brainfile,
# workflow: publish.yml). Bootstrap of a not-yet-published package name should be
# a one-time local `npm publish` (tokens are being phased out of direct publishing:
# staged-only by ~Jan 2027). The NPM_TOKEN fallback below remains for emergencies;
# expect token publishes to require staged human 2FA approval on npmjs.com.

# Tag-driven: pushing a v* (or legacy brainfile@*) tag runs tests, publishes
# both packages, and creates the GitHub Release from the tag.
on:
  push:
    tags: ['v*', 'brainfile@*']
  workflow_dispatch:

permissions:
  contents: write # create the GitHub Release from the tag
  id-token: write # OIDC: trusted publishing + provenance

jobs:
  publish:
    name: Publish packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'

      - name: Ensure npm supports trusted publishing (>= 11.5.1, stay on 11.x)
        run: |
          npm install -g npm@^11.5.1
          npm --version

      - name: Guard — tag matches package versions
        if: github.ref_type == 'tag'
        run: |
          TAG="${GITHUB_REF_NAME}"
          V="${TAG#brainfile@}"; V="${V#v}"
          PKG=$(node -p "require('./cli/package.json').version")
          CORE=$(node -p "require('./core/package.json').version")
          if [ "$V" != "$PKG" ] || [ "$V" != "$CORE" ]; then
            echo "Tag $TAG ($V) does not match cli ($PKG) / core ($CORE) versions" >&2
            exit 1
          fi

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: |
          npm run test:ci -w core
          npm test -w cli

      - name: Configure token auth if NPM_TOKEN is set (bootstrap fallback)
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "$NPM_TOKEN" ]; then
            echo "//registry.npmjs.org/:_authToken=$NPM_TOKEN" > ~/.npmrc
            echo "auth: token (bootstrap)"
          else
            echo "auth: OIDC trusted publishing"
          fi

      - name: Publish @brainfile/core
        run: |
          V=$(node -p "require('./core/package.json').version")
          if npm view "@brainfile/core@$V" version >/dev/null 2>&1; then
            echo "@brainfile/core@$V already on the registry — skipping"
          else
            npm publish -w core --provenance --access public
          fi

      - name: Publish brainfile
        run: |
          V=$(node -p "require('./cli/package.json').version")
          if npm view "brainfile@$V" version >/dev/null 2>&1; then
            echo "brainfile@$V already on the registry — skipping"
          else
            npm publish -w cli --provenance --access public
          fi

      - name: Create GitHub Release from tag
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" --title "brainfile ${GITHUB_REF_NAME#v}" --generate-notes
