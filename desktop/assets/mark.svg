<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Brainfile">
	<!--
		The Brainfile mark, the box: a filled checkbox with the tick cut out,
		square on the left like a bracket and rounded on the right (radius 18 on
		a 64 grid) like the bowl of a b. One shape, one colour: set fill on the
		root, or use currentColor.
	-->
	<defs>
		<mask id="tick" maskUnits="userSpaceOnUse" x="0" y="0" width="64" height="64">
			<rect width="64" height="64" fill="#fff" />
			<path d="M21.5 32.5l7 7 14-15.5" fill="none" stroke="#000" stroke-width="6.2" stroke-linecap="round" stroke-linejoin="round" />
		</mask>
	</defs>
	<path d="M14 10H36a18 18 0 0 1 18 18V36a18 18 0 0 1-18 18H14a4 4 0 0 1-4-4V14a4 4 0 0 1 4-4Z" fill="currentColor" mask="url(#tick)" />
</svg>
